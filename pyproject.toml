[project]
name = "python-deep-fryer"
version = "0.1.0"
description = "Apply \"deep fry\" image effect"
authors = [
    {name = "Corbin Edwards"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pillow (>=12.1.0,<13.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
package-mode = false
